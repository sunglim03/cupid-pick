<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 미리보기</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: "Pretendard", "Malgun Gothic", sans-serif; background: #F6F6F4; color: #222; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: #FFF; border-radius: 14px; padding: 12px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card svg { width: 100%; max-width: 120px; border-radius: 50%; }
  .name { font-weight: 700; margin-top: 6px; }
  .meta { font-size: 13px; color: #666; margin-top: 2px; }
</style>
</head>
<body>
<h1>가상 프로필 24명</h1>
<div class="grid" id="grid"></div>
<script src="profiles.js"></script>
<script src="avatars.js"></script>
<script>
  document.getElementById("grid").innerHTML = PROFILES.map(p => `
    <div class="card">
      ${makeAvatar(p)}
      <div class="name">${p.name}</div>
      <div class="meta">${p.gender} · ${p.age}세 · ${p.style}</div>
    </div>`).join("");
</script>
</body>
</html>
