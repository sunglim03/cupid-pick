<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupid Pick</title>
<style>
  :root {
    --accent: #FF5A6E; --accent2: #FF8A5B; --bg: #F5F4F8; --card: #FFFFFF;
    --text: #1D1D22; --sub: #7A7A86; --line: #E9E8EF; --soft: #FFF0F2; --gold: #F5B83D; --green: #2BB673;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DDDBE5; color: var(--text);
         font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .phone { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }
  header { padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-weight: 800; font-size: 24px; letter-spacing: -0.5px;
          background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hdr-sub { font-size: 13px; color: var(--sub); }
  main { padding: 0 16px 96px; }
  .view { display: none; }
  .view.on { display: block; }
  button { font-family: inherit; }

  /* 하단 탭 */
  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px;
        background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 10; }
  nav button { flex: 1; border: 0; background: none; padding: 10px 0 16px; font-size: 12px; color: var(--sub);
               display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; }
  nav button.on { color: var(--accent); font-weight: 700; }
  nav .ico { font-size: 20px; line-height: 1; }
  nav .badge-n { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--accent); color: #fff; font-size: 10px;
                 font-weight: 700; border-radius: 999px; padding: 1px 6px; display: none; }

  /* 사진 */
  .pic { position: relative; width: 100%; height: 100%; }
  .pic svg { width: 100%; height: 100%; display: block; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%;
             pointer-events: none; -webkit-user-drag: none; }

  /* 카드 스택 */
  .stack { position: relative; height: 600px; margin-top: 4px; }
  .card { position: absolute; inset: 0; background: var(--card); border-radius: 24px; overflow: hidden;
          box-shadow: 0 12px 30px rgba(40, 20, 60, .14); touch-action: none; user-select: none;
          transition: transform .28s ease, opacity .28s ease; display: flex; flex-direction: column; cursor: grab; }
  .card.dragging { transition: none; cursor: grabbing; }
  .card.back { transform: scale(.95) translateY(14px); filter: brightness(.97); pointer-events: none; }
  .photo { height: 400px; position: relative; flex-shrink: 0; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; padding: 50px 18px 14px; color: #fff;
           background: linear-gradient(transparent, rgba(0,0,0,.62)); }
  .nm { font-size: 26px; font-weight: 800; }
  .nm span { font-weight: 500; font-size: 22px; margin-left: 4px; }
  .sub { font-size: 14px; opacity: .92; margin-top: 2px; }
  .badge { position: absolute; top: 14px; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .badge.score { left: 14px; background: rgba(255,255,255,.92); color: var(--accent); }
  .badge.rank { right: 14px; background: rgba(0,0,0,.55); color: #fff; }
  .badge.rank.gold { background: var(--gold); color: #3B2A00; }
  .badge.sent { top: 50px; left: 14px; background: var(--accent); color: #fff; }
  .stamp { position: absolute; top: 70px; font-size: 32px; font-weight: 900; padding: 4px 12px; border: 4px solid; border-radius: 10px; opacity: 0; }
  .stamp.like { left: 22px; color: var(--green); transform: rotate(-14deg); }
  .stamp.nope { right: 22px; color: var(--accent); transform: rotate(14deg); }
  .pop { position: absolute; left: 50%; top: 45%; font-size: 90px; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }
  .pop.go { animation: pop .8s ease forwards; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 30% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
                   60% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  .body { padding: 14px 18px 18px; overflow-y: auto; flex: 1; }
  .why1 { background: #FFF7E3; border: 1px solid #F7DFA0; border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: #F1F0F5; color: #55555F; }
  .tag.hit { background: var(--soft); color: var(--accent); font-weight: 700; }
  .rt { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
  .reason { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .reason b { color: var(--accent); white-space: nowrap; }
  .reason.total { border: 0; font-weight: 800; }

  .actions { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 18px; }
  .act { width: 60px; height: 60px; border-radius: 50%; border: 0; background: #fff; font-size: 24px; cursor: pointer;
         box-shadow: 0 6px 16px rgba(40,20,60,.12); }
  .act.like { width: 72px; height: 72px; font-size: 30px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .act.nope { color: #9A9AA5; }
  .act.chat { color: #6C63FF; }
  .act-label { display: flex; justify-content: center; gap: 20px; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .act-label span { width: 60px; text-align: center; }
  .act-label span.mid { width: 72px; }

  .empty { text-align: center; padding: 70px 20px; color: var(--sub); line-height: 1.6; }
  .empty .big { font-size: 46px; }
  .empty h3 { color: var(--text); margin: 10px 0 4px; }

  .btn { display: inline-block; border: 0; border-radius: 14px; padding: 13px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
         color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.full { width: 100%; }

  /* 패널 */
  .panel { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .panel h2 { font-size: 16px; margin: 0 0 10px; }
  .note { font-size: 13px; color: var(--sub); margin: -4px 0 10px; line-height: 1.5; }
  .welcome { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .welcome h2 { font-size: 18px; }
  .welcome p { margin: 0; font-size: 14px; line-height: 1.5; opacity: .95; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--sub); font-weight: 600; }
  td.pts { color: var(--accent); font-weight: 700; white-space: nowrap; }
  td .why { font-size: 12px; color: var(--sub); }
  .stat { display: flex; gap: 10px; }
  .stat div { flex: 1; background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--sub); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border: 0; }
  .av { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .row .rk { width: 26px; font-weight: 800; color: var(--sub); text-align: center; }
  .row .rk.gold { color: var(--gold); }
  .row .mid { flex: 1; min-width: 0; }
  .row .mid .t { font-size: 14px; font-weight: 700; }
  .row .mid .d { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .row .sc { font-weight: 800; color: var(--accent); }

  /* 좋아요 */
  .sec-t { font-size: 15px; font-weight: 800; margin: 6px 2px 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .mini { background: #fff; border-radius: 18px; overflow: hidden; }
  .mini .pic { aspect-ratio: 3 / 4; }
  .mini .info { padding: 8px 10px 10px; font-size: 14px; }
  .mini .info b { color: var(--accent); float: right; }
  .mini .btn { width: 100%; margin-top: 8px; }

  /* 채팅 목록 */
  .room-item { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .room-item .av { width: 52px; height: 52px; }
  .room-item .mid { flex: 1; min-width: 0; }
  .room-item .t { font-weight: 700; font-size: 15px; }
  .room-item .t small { font-weight: 500; color: var(--accent); margin-left: 4px; }
  .room-item .d { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .room-item .right { text-align: right; font-size: 11px; color: var(--sub); }
  .room-item .unread { display: inline-block; margin-top: 4px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; font-weight: 700; }

  /* 채팅방 */
  .room { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px;
          background: #F1EFF6; z-index: 30; display: none; flex-direction: column; }
  .room.on { display: flex; }
  .room-hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border-bottom: 1px solid var(--line); }
  .room-hd .back { border: 0; background: none; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  .room-hd .av { width: 38px; height: 38px; }
  .room-hd .t { font-weight: 800; }
  .room-hd .s { font-size: 12px; color: var(--sub); }
  .msgs { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
  .msg .av { width: 30px; height: 30px; }
  .msg .bub { padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.45; word-break: break-word; }
  .msg.them .bub { background: #fff; border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg.me .bub { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-bottom-right-radius: 6px; }
  .msg .tm { font-size: 10px; color: var(--sub); white-space: nowrap; }
  .sys { align-self: center; font-size: 12px; color: var(--sub); background: rgba(255,255,255,.7); padding: 5px 12px; border-radius: 999px; text-align: center; }
  .typing .bub { color: var(--sub); }
  .suggest { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; }
  .suggest button { flex-shrink: 0; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .composer { display: flex; gap: 8px; padding: 10px 12px 16px; background: #fff; border-top: 1px solid var(--line); }
  .composer input { flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 15px; font-family: inherit; background: #FBFBFD; }
  .composer button { border: 0; border-radius: 999px; padding: 0 18px; font-weight: 700; color: #fff; cursor: pointer;
                     background: linear-gradient(90deg, var(--accent), var(--accent2)); }

  /* 내 프로필 폼 */
  .me-top { display: flex; align-items: center; gap: 14px; }
  .me-top .av { width: 72px; height: 72px; }
  label.f { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--sub); margin: 14px 0 6px; }
  input[type=text], input[type=number], input[type=password], select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px;
         font-size: 15px; font-family: inherit; background: #FBFBFD; }
  .two { display: flex; gap: 8px; }
  .two > * { flex: 1; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 10px; font-size: 15px; cursor: pointer; color: var(--sub); }
  .seg button.on { background: #fff; color: var(--accent); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; color: #55555F; }
  .chip.on { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .chip.sm { padding: 5px 9px; font-size: 12px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .must { border: 1px solid var(--line); background: #fff; color: var(--sub); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .must.on { background: var(--text); border-color: var(--text); color: #fff; font-weight: 700; }

  /* 로그인 / 회원가입 */
  .auth { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; z-index: 40;
          background: linear-gradient(180deg, #FFF0F2 0%, #FFFFFF 55%); display: none; overflow-y: auto; padding: 28px 24px 36px; }
  .auth.on { display: block; }
  .collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
  .collage .col { display: flex; flex-direction: column; gap: 10px; }
  .collage .col.mid { margin-top: 26px; }
  .tile { aspect-ratio: 3 / 4; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 22px rgba(60, 30, 60, .12); }
  .tile:nth-child(odd) { transform: rotate(-1.5deg); }
  .tile:nth-child(even) { transform: rotate(1.5deg); }
  .brand-row { display: flex; align-items: center; gap: 6px; }
  .brand-row .cupid { width: 74px; height: 74px; animation: float 3s ease-in-out infinite; }
  .logo-row { display: flex; align-items: center; gap: 4px; }
  .logo-row .cupid { width: 34px; height: 34px; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
  .brand { font-size: 44px; font-weight: 900; letter-spacing: -1.5px; color: var(--accent); line-height: 1; }
  .brand i { font-style: normal; color: var(--accent2); }
  .headline { font-size: 27px; font-weight: 800; line-height: 1.35; margin: 18px 0 10px; letter-spacing: -0.5px; }
  .tagline { font-size: 15px; color: var(--sub); margin: 0 0 26px; }
  .auth .btn.full { padding: 16px; font-size: 16px; border-radius: 16px; box-shadow: 0 8px 20px rgba(255, 90, 110, .28); }
  .btn.soft { background: #F3F2F7; color: var(--text); box-shadow: none !important; margin-top: 10px; }
  .auth-back { border: 0; background: none; font-size: 15px; color: var(--sub); cursor: pointer; padding: 0; margin-bottom: 18px; }
  .auth-title { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
  .auth-err { color: var(--accent); font-size: 13px; min-height: 18px; margin: 12px 0 4px; }
  .auth-note { text-align: center; font-size: 12px; color: var(--sub); margin-top: 16px; line-height: 1.5; }
  .auth-note button { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 12px; padding: 0; }

  /* 프로필 사진 고르기 */
  .pp { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pp-prev { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; box-shadow: 0 6px 16px rgba(40,20,60,.15); }
  .pp-lab { font-size: 12px; color: var(--sub); }
  .pp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; }
  .pp-opt { border: 3px solid transparent; border-radius: 50%; padding: 0; overflow: hidden; aspect-ratio: 1; cursor: pointer; background: none; }
  .pp-opt.on { border-color: var(--accent); }
  .pp-opt svg { width: 100%; height: 100%; display: block; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: rgba(29,29,34,.92); color: #fff;
           padding: 11px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 50; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="logo-row"><div class="logo">Cupid Pick</div><span id="logoCupid"></span></div>
    <div class="hdr-sub" id="hdrSub"></div>
  </header>

  <main>
    <section class="view on" id="v-rec"></section>
    <section class="view" id="v-chat"></section>
    <section class="view" id="v-likes"></section>
    <section class="view" id="v-logic"></section>
    <section class="view" id="v-me"></section>
  </main>

  <nav>
    <button data-tab="rec" class="on"><span class="ico">🔥</span>추천</button>
    <button data-tab="chat"><span class="ico">💬</span>채팅<span class="badge-n" id="chatBadge"></span></button>
    <button data-tab="likes"><span class="ico">💗</span>하트</button>
    <button data-tab="logic"><span class="ico">🧮</span>내 로직</button>
    <button data-tab="me"><span class="ico">👤</span>내 프로필</button>
  </nav>
</div>

<div class="auth" id="auth"></div>

<div class="room" id="room"></div>
<div class="toast" id="toast"></div>

<script src="profiles.js"></script>
<script src="avatars.js"></script>
<script src="cupid.js"></script>
<script>
document.getElementById("logoCupid").innerHTML = CUPID_SVG;
// =====================================================
// 점수표 (점수표.md 와 같은 내용) — 만점 100
// =====================================================
const RULES = {
  interestEach: 10, interestMax: 30,  // 관심사 겹침 1개당 10, 최대 30
  style: 15,                          // 외모 스타일 일치
  region: 15,                         // 같은 지역
  age: 10,                            // 이상형 나이 범위 안
  height: 10,                         // 키 근접도 (최대)
  salary: 5, religion: 5, smoke: 5, mbti: 5,
};
// 키 근접도: [차이 이하(cm), 점수]
const HEIGHT_TIERS = [[2, 10], [5, 7], [8, 4], [10, 2]];
const HEIGHT_MUST_RANGE = 5;  // 키에 '꼭' 체크하면 이 차이를 넘는 사람은 거른다
const heightPts = diff => (HEIGHT_TIERS.find(([d]) => diff <= d) || [0, 0])[1];

// ① 거르기: 걸리면 이유를, 통과하면 null
function filterOut(me, p) {
  const m = me.must || {};
  if (p.id === me.id || p.name === me.name) return "나 자신";
  if (p.gender === me.gender) return "같은 성별";
  if (m.age && (p.age < me.ageMin || p.age > me.ageMax)) return "나이";
  if (m.height && Math.abs(p.height - me.idealHeight) > HEIGHT_MUST_RANGE) return "키";
  if (m.style && me.likeStyles.length && !me.likeStyles.includes(p.style)) return "외모 스타일";
  if (m.region && me.wantSameRegion && p.region !== me.region) return "지역";
  if (m.salary && me.minSalary && p.salary < me.minSalary) return "연봉";
  if (m.religion && me.wantReligion !== "상관없음" && p.religion !== me.wantReligion) return "종교";
  if (m.smoke && me.wantNoSmoke && p.smoke) return "흡연";
  if (m.mbti && me.wantMbti.length && !me.wantMbti.includes(p.mbti)) return "MBTI";
  if (m.interests && !p.interests.some(i => me.interests.includes(i))) return "관심사";
  return null;
}

// ② 점수: 무엇이 맞으면 몇 점인지 항목별로 기록
function scoreOf(me, p) {
  const items = [];
  const add = (label, short, pts) => pts && items.push({ label, short, pts });
  const shared = p.interests.filter(i => me.interests.includes(i));
  if (shared.length) add(`관심사 ${shared.length}개 겹침 (${shared.join(", ")})`, `관심사 ${shared.length}개 겹침`, Math.min(shared.length * RULES.interestEach, RULES.interestMax));
  if (me.likeStyles.includes(p.style)) add(`좋아하는 스타일 (${p.style})`, "좋아하는 스타일", RULES.style);
  if (me.wantSameRegion && p.region === me.region) add(`같은 지역 (${p.region})`, "같은 지역", RULES.region);
  if (p.age >= me.ageMin && p.age <= me.ageMax) add(`이상형 나이 (${p.age}살)`, "이상형 나이", RULES.age);
  const hd = Math.abs(p.height - me.idealHeight);
  add(`키 ${p.height}cm (이상형과 ${hd}cm 차이)`, "키", heightPts(hd));
  if (me.minSalary && p.salary >= me.minSalary) add(`연봉 ${me.minSalary.toLocaleString()}만원 이상`, "연봉", RULES.salary);
  if (me.wantReligion !== "상관없음" && p.religion === me.wantReligion) add(`종교 (${p.religion})`, "종교", RULES.religion);
  if (me.wantNoSmoke && !p.smoke) add("비흡연", "비흡연", RULES.smoke);
  if (me.wantMbti.includes(p.mbti)) add(`선호 MBTI (${p.mbti})`, "MBTI", RULES.mbti);
  items.sort((a, b) => b.pts - a.pts);
  return { items, total: items.reduce((s, i) => s + i.pts, 0), shared: shared.length, gap: Math.abs(p.age - me.age) };
}

// ③ 추천: 거르고 → 점수 → 정렬 (동점: 관심사 많이 겹친 순 → 나이 차이 적은 순)
function recommend(me) {
  const passed = [], removed = [];
  for (const p of PROFILES) {
    const why = filterOut(me, p);
    if (why) removed.push({ p, why });
    else passed.push({ p, ...scoreOf(me, p) });
  }
  passed.sort((a, b) => b.total - a.total || b.shared - a.shared || a.gap - b.gap);
  passed.forEach((r, i) => r.rank = i + 1);
  return { passed, removed };
}

function firstPlaceSentence(list) {
  const [a, b] = list;
  if (!a) return "";
  const top = a.items.slice(0, 3).map(i => `${i.short}(+${i.pts})`).join(", ");
  let s = `<b>${a.p.name}</b>님은 ${top || "거르기 조건을 모두 통과"} 덕분에 <b>${a.total}점</b>으로 1위예요.`;
  if (b) s += b.total === a.total
    ? ` 2위 ${b.p.name}님과 동점이지만 ${a.shared > b.shared ? "관심사가 더 많이 겹쳐서" : "나이 차이가 더 적어서"} 앞섰어요.`
    : ` 2위 ${b.p.name}님보다 ${a.total - b.total}점 높아요.`;
  return s;
}

// root 안의 고르기 화면으로 sel 객체의 photo / avatarPreset 을 바꾼다
function bindPicker(root, sel, onChange) {
  const opts = root.querySelectorAll(".pp-opt");
  const update = () => {
    root.querySelector(".pp-prev").innerHTML = avatar(sel);
    opts.forEach(b => b.classList.toggle("on", !sel.photo && !!sel.avatarPreset && sel.avatarPreset.id === PRESETS[b.dataset.i].id));
    if (onChange) onChange();
  };
  opts.forEach(b => b.onclick = () => { sel.photo = null; sel.avatarPreset = PRESETS[b.dataset.i]; update(); });
  root.querySelector("input[type=file]").onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { sel.photo = await shrinkImage(f); update(); } catch (err) { toast("사진을 불러오지 못했어요"); }

// 저장 공간을 아끼려고 긴 변 480px JPEG로 줄인다
function shrinkImage(file, max = 480) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function bindDrag(el) {
  let sx = 0, dx = 0, down = false;
  const like = el.querySelector(".stamp.like"), nope = el.querySelector(".stamp.nope");
  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".body")) return;
    down = true; sx = e.clientX; dx = 0; el.classList.add("dragging"); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    dx = e.clientX - sx;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    like.style.opacity = Math.max(0, dx / 100);
    nope.style.opacity = Math.max(0, -dx / 100);
  });
  const end = () => {
    if (!down) return;
    down = false; el.classList.remove("dragging");
    if (dx > 100) decide(true);
    else if (dx < -100) decide(false);
    else { el.style.transform = ""; like.style.opacity = 0; nope.style.opacity = 0; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  // 인스타그램처럼 사진 더블클릭 = 하트
  el.addEventListener("dblclick", e => { if (!e.target.closest(".body")) sendHeart(result.passed[deckIdx].p.id, el); });
}

function decide(isLike) {
  const el = document.querySelector("#v-rec .card:not(.back)");
  if (!el) return;
  if (isLike) sendHeart(result.passed[deckIdx].p.id, el, true);
  el.querySelector(isLike ? ".stamp.like" : ".stamp.nope").style.opacity = 1;
  el.style.transform = `translateX(${isLike ? 520 : -520}px) rotate(${isLike ? 28 : -28}deg)`;
  el.style.opacity = 0;
  setTimeout(() => { deckIdx++; renderDeck(); }, 260);
}

function sendHeart(id, cardEl, silentPop) {
  const p = byId(id);
  if (cardEl && !silentPop) {
    const pop = cardEl.querySelector(".pop");
    pop.classList.remove("go"); void pop.offsetWidth; pop.classList.add("go");
  }
  if (state.sent.includes(id)) { toast(`이미 ${p.name}님에게 하트를 보냈어요`); return; }
  state.sent.push(id); save();
  toast(`💗 ${p.name}님에게 하트를 보냈어요`);
  renderLikes();
  if (cardEl && !silentPop && !cardEl.querySelector(".badge.sent")) {
    cardEl.querySelector(".photo").insertAdjacentHTML("beforeend", `<div class="badge sent">💗 하트 보냄</div>`);
  }
  // 가상 상대의 반응: 매칭 점수 50점 이상이면 하트를 돌려준다
  if (scoreFor(id) >= 50) {
    setTimeout(() => {
      if (state.matched.includes(id)) return;
      state.matched.push(id);
      pushMsg(id, "sys", `🎉 ${p.name}님과 서로 하트! 매칭됐어요`);
      pushMsg(id, "them", `하트 고마워요! 저도 ${me.name}님 프로필 보고 궁금했어요 😊`);
      toast(`🎉 ${p.name}님도 하트를 보냈어요! 매칭 성공`);
      renderLikes();
    }, 1600);
  }
}

  const c = state.chats[id] = state.chats[id] || { msgs: [], unread: 0 };
  c.msgs.push({ from, text, t: now() });
  if (from === "them" && openId !== id) c.unread++;

  if (openId === id) renderMsgs();
}

function renderChatList() {
  const ids = Object.keys(state.chats).map(Number).filter(id => state.chats[id].msgs.length)
    .sort((a, b) => state.chats[b].msgs.length - state.chats[a].msgs.length);
  const unread = ids.reduce((s, id) => s + state.chats[id].unread, 0);
  const badge = $("chatBadge");
  badge.textContent = unread; badge.style.display = unread ? "block" : "none";
  $("v-chat").innerHTML = ids.length
    ? ids.map(id => {
        const p = byId(id), c = state.chats[id], last = c.msgs[c.msgs.length - 1];

          <div class="av">${avatar(p)}</div>
          <div class="mid"><div class="t">${p.name}${state.matched.includes(id) ? "<small>💞 매칭</small>" : ""}</div>

function openRoom(id) {
  const p = byId(id);
  openId = id;
  state.chats[id] = state.chats[id] || { msgs: [], unread: 0 };
  state.chats[id].unread = 0; save();

  const tips = ["안녕하세요! 프로필 보고 연락드려요 😊",
    shared[0] ? `${shared[0]} 좋아하신다고 해서 반가웠어요!` : `${p.interests[0]} 좋아하세요?`,

  $("room").innerHTML = `
    <div class="room-hd">
      <button class="back" onclick="closeRoom()">‹</button>

      <input id="msgInput" placeholder="메시지 보내기" autocomplete="off"><button>전송</button>

function renderMsgs(typing) {
  const p = byId(openId), msgs = state.chats[openId].msgs;
  const box = $("msgs");
  box.innerHTML = (msgs.length ? "" : `<div class="sys">${p.name}님에게 먼저 인사를 건네 보세요</div>`) +

function sendMsg(text) {
  text = (text || "").trim();
  if (!text || openId === null) return;
  const id = openId;
  $("msgInput").value = "";
  pushMsg(id, "me", text);
  setTimeout(() => { if (openId === id) renderMsgs(true); }, 400);
  setTimeout(() => pushMsg(id, "them", botReply(byId(id), text)), 1400 + Math.random() * 800);
}

// 가상 상대의 자동 답장 (관심사·지역을 섞어서)
function botReply(p, text) {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const i = pick(p.interests), shared = p.interests.filter(x => me.interests.includes(x));
  if (/안녕|반가|하이|hi|hello/i.test(text)) return `안녕하세요 ${me.name}님! 반가워요 😊 ${shared[0] ? `저도 ${shared[0]} 정말 좋아해요!` : "프로필 잘 봤어요."}`;
  if (/주말|뭐\s?해|취미|쉬는/.test(text)) return `주말엔 주로 ${i} 하면서 보내요. ${me.name}님은요?`;
  if (/만나|커피|밥|식사|약속|언제/.test(text)) return `좋아요! ${p.region} 쪽이면 편할 것 같아요 ☕ 이번 주말 어떠세요?`;
  if (shared.some(s => text.includes(s))) return `맞아요 ${shared.find(s => text.includes(s))} 진짜 좋아해요 ㅎㅎ 같이 하면 재밌겠다!`;
  if (/\?|요\?|까\?/.test(text)) return `음… 좋은 질문이에요 ㅎㅎ 저는 ${i} 할 때 제일 행복한 것 같아요.`;
  return pick([`오 진짜요? ㅋㅋ 더 얘기해 주세요!`, `${i} 좋아하세요? 요즘 저는 ${i}에 빠져 있어요.`,
               `ㅎㅎ 대화가 잘 통하는 것 같아요 😊`, `그거 완전 공감돼요!`, `${me.name}님은 어떤 사람이 이상형이에요?`]);
}

// =====================================================
// 내 로직 탭
// =====================================================
function renderLogic() {
  const { passed, removed } = result, m = me.must || {};
  const byWhy = {};
  removed.forEach(r => (byWhy[r.why] = byWhy[r.why] || []).push(r.p.name));
  const onOff = (k, desc) => m[k] ? desc : `<span style="color:var(--sub)">꼭 아님 → 점수로</span>`;
  const filterRows = [
    ["나 자신", "추천하지 않음"],
    ["같은 성별", me.gender === "남" ? "여성만 추천" : "남성만 추천"],
    ["나이", onOff("age", `${me.ageMin}~${me.ageMax}살만`)],
    ["키", onOff("height", `${me.idealHeight}cm ±${HEIGHT_MUST_RANGE}cm만`)],
    ["외모 스타일", onOff("style", me.likeStyles.join(", ") || "-")],
    ["지역", onOff("region", `${me.region}만`)],
    ["연봉", onOff("salary", me.minSalary ? `${me.minSalary.toLocaleString()}만원 이상만` : "-")],
    ["종교", onOff("religion", me.wantReligion)],
    ["흡연", onOff("smoke", "비흡연자만")],
    ["MBTI", onOff("mbti", me.wantMbti.join(", ") || "-")],
    ["관심사", onOff("interests", "1개 이상 겹치는 사람만")],
  ].map(([k, d]) => `<tr><td>${k}</td><td>${d}</td><td class="pts">${(byWhy[k] || []).length}명</td></tr>`).join("");

  const scoreRows = [
    ["관심사 겹침", `1개당 ${RULES.interestEach} (최대 ${RULES.interestMax})`, "오래 만나려면 같이 할 거리가 필요해요"],
    ["외모 스타일", RULES.style, "첫인상이 첫 만남을 좌우해요"],
    ["같은 지역", RULES.region, "만나기 어려우면 이어지기 힘들어요"],
    ["이상형 나이", RULES.age, "기본 조건"],
    ["키 근접도", `최대 ${RULES.height}`, "가까울수록 점수 (아래 표)"],
    ["연봉", RULES.salary, "중요하면 '꼭'으로 거르기"],
    ["종교", RULES.religion, "중요하면 '꼭'으로 거르기"],
    ["비흡연", RULES.smoke, "중요하면 '꼭'으로 거르기"],
    ["MBTI", RULES.mbti, "재미 요소라 가장 낮게"],
  ].map(([k, p, w]) => `<tr><td>${k}<div class="why">${w}</div></td><td class="pts">+${p}</td></tr>`).join("");

  let prev = 0;
  const heightRows = HEIGHT_TIERS.map(([d, p]) => {
    const r = `<tr><td>${prev}~${d}cm 차이</td><td>${me.idealHeight - d}~${me.idealHeight + d}cm</td><td class="pts">+${p}</td></tr>`;
    prev = d + 1; return r;
  }).join("") + `<tr><td>${prev}cm 이상</td><td></td><td class="pts">0</td></tr>`;

  const rank = passed.map(r => `
    <div class="row">
      <div class="rk ${r.rank === 1 ? "gold" : ""}">${r.rank === 1 ? "👑" : r.rank}</div>
      <div class="av">${avatar(r.p)}</div>
      <div class="mid"><div class="t">${r.p.name} · ${r.p.age}</div>
        <div class="d">${r.items.map(i => `${i.short} +${i.pts}`).join(" · ") || "맞는 항목 없음"}</div>
        <div class="bar"><i style="width:${r.total}%"></i></div></div>
      <div class="sc">${r.total}</div>
    </div>`).join("");

  $("v-logic").innerHTML = `
    <div class="panel"><div class="stat">
      <div><b>${PROFILES.length}</b><span>전체</span></div>
      <div><b>${removed.length}</b><span>걸러짐</span></div>
      <div><b style="color:var(--accent)">${passed.length}</b><span>추천 대상</span></div>
    </div></div>
    ${passed[0] ? `<div class="panel"><h2>👑 왜 1위인가요?</h2><div style="font-size:14px;line-height:1.6">${firstPlaceSentence(passed)}</div></div>` : ""}
    <div class="panel"><h2>① 거르기 — 절대 안 되는 조건</h2>
      <p class="note">하나라도 걸리면 추천에서 빠져요. 내 프로필에서 '꼭'을 누른 항목만 거르기에 들어가요.</p>
      <table><tr><th>조건</th><th>기준</th><th>제외</th></tr>${filterRows}</table></div>
    <div class="panel"><h2>② 점수 — 무엇이 맞으면 몇 점 (만점 100)</h2>
      <p class="note">거르기를 통과한 사람끼리 점수를 매겨요. '상관없음'으로 둔 항목은 점수에 넣지 않아요.</p>
      <table>${scoreRows}</table>
      <h2 style="margin-top:16px">키 근접도 (이상형 ${me.idealHeight}cm)</h2>
      <table>${heightRows}</table></div>
    <div class="panel"><h2>③ 이유 — 전체 순위</h2>
      <p class="note">동점이면 관심사가 더 많이 겹친 사람 → 나이 차이가 적은 사람이 앞서요.</p>
      ${rank || `<div class="note">조건에 맞는 사람이 0명이에요.</div>`}</div>`;
}

// =====================================================
// 내 프로필 + 이상형
// =====================================================
const ALL_INTERESTS = [...new Set(PROFILES.flatMap(p => p.interests))].sort();
const ALL_STYLES = Object.keys(STYLE_LOOK);
const REGIONS = [...new Set(PROFILES.map(p => p.region))];
const RELIGIONS = ["무교", "기독교", "천주교", "불교"];
const MBTIS = ["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP","ESTP","ESFP","ENFP","ENTP","ESTJ","ESFJ","ENFJ","ENTJ"];
const SALARIES = [[0, "상관없음"], [3000, "3,000만원 이상"], [4000, "4,000만원 이상"], [5000, "5,000만원 이상"], [6000, "6,000만원 이상"]];
const opts = (arr, cur) => arr.map(x => `<option ${x === cur ? "selected" : ""}>${x}</option>`).join("");
const chips = (arr, sel, key, sm) => arr.map(x => `<button type="button" class="chip ${sm ? "sm" : ""} ${sel.includes(x) ? "on" : ""}" data-key="${key}" data-val="${x}">${x}</button>`).join("");
const must = k => `<button type="button" class="must ${(me.must || {})[k] ? "on" : ""}" data-must="${k}">꼭</button>`;

function renderMe() {
  $("v-me").innerHTML = `
    ${firstVisit ? `<div class="panel welcome"><h2>Cupid Pick에 오신 걸 환영해요 💘</h2>
      <p>나와 이상형을 입력하면 내 로직으로 가장 잘 맞는 상대를 찾아드려요. 절대 양보 못 하는 조건은 <b>'꼭'</b>을 눌러 주세요.</p></div>` : ""}
    <div class="panel me-top"><div class="av" id="meTopAv">${avatar(me)}</div>
      <div style="flex:1"><div style="font-size:18px;font-weight:800">${esc(me.name)} · ${me.age}</div>
      <div style="font-size:13px;color:var(--sub)">${me.gender} · ${me.region} · ${me.mbti} · ${me.style}</div></div>
      <button type="button" class="btn sm ghost" onclick="const p=$('ppPanel');p.style.display=p.style.display==='none'?'block':'none'">사진 바꾸기</button></div>
    <div class="panel" id="ppPanel" style="display:none">${photoPickerHTML(me)}</div>

    <div class="panel"><h2>나는</h2>
      <label class="f">이름</label><input type="text" id="f-name" value="${esc(me.name)}">
      <label class="f">성별 <span>${me.gender === "남" ? "여성이 추천돼요" : "남성이 추천돼요"}</span></label>
      <div class="seg" id="f-gender">${["남", "여"].map(g => `<button type="button" class="${me.gender === g ? "on" : ""}" data-g="${g}">${g === "남" ? "남성" : "여성"}</button>`).join("")}</div>
      <div class="two"><div><label class="f">나이</label><input type="number" id="f-age" value="${me.age}"></div>
        <div><label class="f">키</label><input type="number" id="f-height" value="${me.height}"></div></div>
      <div class="two"><div><label class="f">지역</label><select id="f-region">${opts(REGIONS, me.region)}</select></div>
        <div><label class="f">MBTI</label><select id="f-mbti">${opts(MBTIS, me.mbti)}</select></div></div>
      <div class="two"><div><label class="f">종교</label><select id="f-religion">${opts(RELIGIONS, me.religion)}</select></div>
        <div><label class="f">내 스타일</label><select id="f-style">${opts(ALL_STYLES, me.style)}</select></div></div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="f-smoke" ${me.smoke ? "checked" : ""}>흡연해요</label>
      <label class="f">내 관심사 ${must("interests")}</label><div class="chips">${chips(ALL_INTERESTS, me.interests, "interests")}</div>
    </div>

    <div class="panel"><h2>💘 내 이상형</h2>
      <p class="note">'꼭'을 누르면 맞지 않는 사람은 아예 추천에서 빠지고, 누르지 않으면 맞을 때 점수만 더해져요.</p>
      <label class="f">나이 ${must("age")}</label>
      <div class="two"><input type="number" id="f-ageMin" value="${me.ageMin}"><input type="number" id="f-ageMax" value="${me.ageMax}"></div>
      <label class="f">이상형 키 (가까울수록 점수) ${must("height")}</label>
      <input type="number" id="f-idealHeight" value="${me.idealHeight}">
      <label class="f">외모 스타일 ${must("style")}</label><div class="chips">${chips(ALL_STYLES, me.likeStyles, "likeStyles")}</div>
      <label class="f">지역 ${must("region")}</label>
      <label class="check"><input type="checkbox" id="f-sameRegion" ${me.wantSameRegion ? "checked" : ""}>같은 지역이면 좋아요</label>
      <label class="f">연봉 ${must("salary")}</label>
      <select id="f-minSalary">${SALARIES.map(([v, t]) => `<option value="${v}" ${v === me.minSalary ? "selected" : ""}>${t}</option>`).join("")}</select>
      <label class="f">종교 ${must("religion")}</label><select id="f-wantReligion">${opts(["상관없음", ...RELIGIONS], me.wantReligion)}</select>
      <label class="f">흡연 ${must("smoke")}</label>
      <label class="check"><input type="checkbox" id="f-noSmoke" ${me.wantNoSmoke ? "checked" : ""}>비흡연자면 좋아요</label>
      <label class="f">MBTI (선택 안 하면 상관없음) ${must("mbti")}</label><div class="chips">${chips(MBTIS, me.wantMbti, "wantMbti", true)}</div>
    </div>
    <button class="btn full" id="f-save">저장하고 추천 받기</button>
    <div style="text-align:center;margin-top:14px;display:flex;gap:8px;justify-content:center">
      <button class="btn sm ghost" onclick="resetAll()">하트·채팅 기록 초기화</button>
      <button class="btn sm ghost" onclick="logout()">로그아웃 (${esc(user)})</button></div>`;

  bindPicker($("ppPanel"), me, () => { $("meTopAv").innerHTML = avatar(me); if (!firstVisit) save(); });
  $("f-gender").onclick = e => { const g = e.target.dataset.g; if (!g) return; me.gender = g; renderMe(); };
  document.querySelectorAll("#v-me .chip").forEach(c => c.onclick = () => {
    const arr = me[c.dataset.key], v = c.dataset.val;
    me[c.dataset.key] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
    c.classList.toggle("on");
  });
  document.querySelectorAll("#v-me .must").forEach(b => b.onclick = () => {
    me.must = me.must || {};
    me.must[b.dataset.must] = !me.must[b.dataset.must];
    b.classList.toggle("on");
  });
  $("f-save").onclick = () => {
    const num = id => Number($(id).value) || 0;
    Object.assign(me, {
      name: $("f-name").value.trim() || "나", age: num("f-age"), height: num("f-height"),
      region: $("f-region").value, mbti: $("f-mbti").value, religion: $("f-religion").value, style: $("f-style").value,
      smoke: $("f-smoke").checked, ageMin: num("f-ageMin"), ageMax: num("f-ageMax"), idealHeight: num("f-idealHeight"),
      wantSameRegion: $("f-sameRegion").checked, minSalary: num("f-minSalary"), wantReligion: $("f-wantReligion").value,
      wantNoSmoke: $("f-noSmoke").checked,
    });
    firstVisit = false;
    save(); refresh(); go("rec");
    toast(`추천 ${result.passed.length}명을 찾았어요`);
  };
}

function resetAll() {
  state.sent = []; state.matched = []; state.chats = {};
  save(); refresh(); toast("하트와 채팅 기록을 지웠어요");
}

function go(tab) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + tab));
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.tab));

// =====================================================
// 로그인 / 회원가입 (데모: 계정은 이 브라우저에만 저장)
// =====================================================
let authMode = "landing";
// 가입 화면에서 고른 사진 (가입 완료 시 내 프로필로 옮긴다)
let joinPick = { id: 0, name: "나", gender: "남", style: "캐주얼", photo: null, avatarPreset: PRESETS[6] };
const COLLAGE = [[1, 6], [3, 10], [2, 7]];  // 첫 화면 사진 (세로줄별 프로필 id)
function showAuth(mode) {
  authMode = mode || "landing";
  if (authMode === "landing") {
    $("auth").innerHTML = `
      <div class="collage">${COLLAGE.map((ids, i) =>
        `<div class="col ${i === 1 ? "mid" : ""}">${ids.map(id => `<div class="tile">${avatar(byId(id))}</div>`).join("")}</div>`).join("")}</div>
      <div class="brand-row"><div class="brand">Cupid Pick<i>.</i></div>${CUPID_SVG}</div>
      <div class="headline">왜 이 사람인지<br>보여주는 소개팅</div>
      <p class="tagline">거르기 → 점수 → 이유. 추천 로직을 숨기지 않아요.</p>
      <button class="btn full" onclick="showAuth('join')">시작하기</button>
      <button class="btn full soft" onclick="showAuth('login')">이미 계정이 있어요</button>`;
  } else {
    const isJoin = authMode === "join";
    $("auth").innerHTML = `
      <form id="authForm" autocomplete="off">
        <button type="button" class="auth-back" onclick="showAuth('landing')">‹ 처음으로</button>
        <div class="brand-row"><div class="brand" style="font-size:32px">Cupid Pick<i>.</i></div>${CUPID_SVG}</div>
        <h2 class="auth-title" style="margin-top:18px">${isJoin ? "반가워요! 계정을 만들어요" : "다시 오셨네요 😊"}</h2>
        <p class="tagline" style="margin-bottom:6px">${isJoin ? "가입하면 바로 내 이상형을 고를 수 있어요." : "아이디와 비밀번호를 입력해 주세요."}</p>
        ${isJoin ? `<label class="f">프로필 사진</label>${photoPickerHTML(joinPick)}` : ""}
        <label class="f">아이디</label><input type="text" id="a-id" placeholder="영문·숫자 3자 이상">
        <label class="f">비밀번호</label><input type="password" id="a-pw" placeholder="4자 이상">
        ${isJoin ? `<label class="f">비밀번호 확인</label><input type="password" id="a-pw2">
          <label class="f">이름 (닉네임)</label><input type="text" id="a-name" placeholder="예: 지훈">` : ""}
        <div class="auth-err" id="a-err"></div>
        <button class="btn full">${isJoin ? "가입하고 시작하기" : "로그인"}</button>
        <div class="auth-note">${isJoin
          ? `이미 계정이 있나요? <button type="button" onclick="showAuth('login')">로그인</button>`
          : `처음이신가요? <button type="button" onclick="showAuth('join')">회원가입</button>`}<br>
          수업용 데모 앱이에요. 실제로 쓰는 비밀번호는 넣지 마세요.</div>
      </form>`;
    $("authForm").onsubmit = onAuthSubmit;
    if (isJoin) bindPicker($("auth"), joinPick);
    $("a-id").focus();
  }
  $("auth").classList.add("on");
  $("auth").scrollTop = 0;
}

function onAuthSubmit(e) {
  e.preventDefault();
  const id = $("a-id").value.trim(), pw = $("a-pw").value;
  const err = msg => { $("a-err").textContent = msg; };
  const accounts = getJSON(ACCOUNTS_KEY) || {};
  if (!/^[A-Za-z0-9_]{3,}$/.test(id)) return err("아이디는 영문·숫자 3자 이상이에요");
  if (pw.length < 4) return err("비밀번호는 4자 이상이에요");
  if (authMode === "join") {
    const name = $("a-name").value.trim();
    if (accounts[id]) return err("이미 있는 아이디예요");
    if (pw !== $("a-pw2").value) return err("비밀번호가 서로 달라요");
    if (!name) return err("이름을 입력해 주세요");
    accounts[id] = { pw, name };
    setJSON(ACCOUNTS_KEY, accounts);
    startApp(id, name, joinPick);
    joinPick = { ...joinPick, photo: null };
    toast(`${name}님, 가입을 환영해요! 프로필부터 채워 볼까요?`);
  } else {
    if (!accounts[id] || accounts[id].pw !== pw) return err("아이디 또는 비밀번호가 맞지 않아요");
    startApp(id);
    toast(`${me.name}님, 다시 오셨네요 😊`);
  }
}

function startApp(id, name, pick) {
  user = id;
  setJSON(SESSION_KEY, id);
  state = load(); me = state.me;
  if (firstVisit && name) me.name = name;
  if (firstVisit && pick) { me.photo = pick.photo; me.avatarPreset = pick.avatarPreset; }
  $("auth").classList.remove("on");
  refresh();
  go(firstVisit ? "me" : "rec");
}

function logout() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  closeRoom();
  user = null;
  showAuth("landing");
}

const session = getJSON(SESSION_KEY);
if (session && (getJSON(ACCOUNTS_KEY) || {})[session]) startApp(session);
else showAuth("landing");
</script>
</body>
</html>
